name: R677 Aruken character identity safe-rename test
on:
  pull_request:
    paths:
      - 'src/data/arkonChapter*.js'
      - 'src/data/characterDisplayName.js'
      - 'src/data/characters.js'
      - 'src/data/cars.js'
      - 'src/data/chapter08.js'
      - 'src/data/cutscenes.js'
      - 'src/data/ginzaScenes.js'
      - 'src/scenes/MeetScene.js'
      - 'src/scenes/RaceScene.js'
      - 'src/ui/Arkon*.js'
      - 'src/ui/GinzaBanterHud.js'
      - 'tests/arkon-character-identity-r677.mjs'
      - '.github/workflows/arkon-character-identity-r677.yml'
  workflow_dispatch:
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and import validation
        run: |
          node --check src/data/characterDisplayName.js
          node --check src/data/characters.js
          node --check src/scenes/RaceScene.js
          node --check src/scenes/MeetScene.js
          node --check src/ui/ArkonStoryObjective.js
          node --check tests/arkon-character-identity-r677.mjs
      - name: Identity, save, story and career regressions
        run: |
          # Two pre-existing main-branch failures (R674 identity-equality assertion
          # and R532 fixed dialogue roster count) are tracked separately.
          node --test tests/arkon-character-identity-r677.mjs tests/arkonStoryMode.test.mjs tests/arkon-chapter02-r655.mjs tests/arkon-chapter03-r656.mjs tests/arkon-chapter06-r668.mjs tests/ginza-arkon-private-gallery-r629.mjs tests/ginza-arkon-showdowns-r637.mjs 
