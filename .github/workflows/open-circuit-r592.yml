name: R592 Open Circuit Rotation
on:
  pull_request:
    paths:
      - 'src/environment/WorldClock.js'
      - 'src/data/proSeason.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/ui/ProSeasonPanel.js'
      - 'tests/open-circuit-rotation-r592.mjs'
      - '.github/workflows/open-circuit-r592.yml'
  push:
    branches: [main]
    paths:
      - 'src/environment/WorldClock.js'
      - 'src/data/proSeason.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/ui/ProSeasonPanel.js'
      - 'tests/open-circuit-rotation-r592.mjs'
jobs:
  open-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse updated clock, event and UI modules
        run: |
          node --check src/environment/WorldClock.js
          node --check src/data/proSeason.js
          node --check src/ui/ProSeasonPanel.js
          node --check src/scenes/CentralTokyoScene.js
      - name: Validate time slots, trophies and registered crew formats
        run: node --test tests/open-circuit-rotation-r592.mjs
