name: R672 Arkon Chapter 08 The Price of Ambition
on:
  push:
    branches: [main]
    paths:
      - 'src/data/arkonChapter08*.js'
      - 'src/data/storyDirectorScripts.js'
      - 'src/story/StoryDirector.js'
      - 'src/story/StoryScript.js'
      - 'src/scenes/RaceScene.js'
      - 'src/scenes/GarageScene.js'
      - 'src/ui/StoryStage.js'
      - 'src/ui/ArkonStoryObjective.js'
      - 'src/ui/ArkonStoryArchivePanel.js'
      - 'src/ui/ArkonPlayableReplay.js'
      - 'src/state/GameState.js'
      - 'tests/arkon-chapter08-r672.mjs'
  pull_request:
    paths:
      - 'src/data/arkonChapter08*.js'
      - 'src/data/storyDirectorScripts.js'
      - 'src/story/StoryDirector.js'
      - 'src/story/StoryScript.js'
      - 'src/scenes/RaceScene.js'
      - 'src/scenes/GarageScene.js'
      - 'src/ui/StoryStage.js'
      - 'src/ui/ArkonStoryObjective.js'
      - 'src/ui/ArkonStoryArchivePanel.js'
      - 'src/ui/ArkonPlayableReplay.js'
      - 'src/state/GameState.js'
      - 'tests/arkon-chapter08-r672.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks for Chapter 8 and modified runtime
        run: |
          for file in src/data/arkonChapter08.js src/data/arkonChapter08Races.js src/data/storyDirectorScripts.js src/story/StoryScript.js src/story/StoryDirector.js src/data/characters.js src/ui/StoryStage.js src/ui/ArkonStoryObjective.js src/ui/ArkonPlayableReplay.js src/ui/ArkonStoryArchivePanel.js src/scenes/RaceScene.js src/scenes/GarageScene.js src/state/GameState.js tests/arkon-chapter08-r672.mjs; do node --check "$file"; done
      - name: Chapter 8 and previous Arkon regression suite
        run: |
          node --test tests/arkon-chapter08-r672.mjs tests/arkon-chapter07-r669.mjs tests/arkon-chapter06-polish-r671.mjs tests/arkon-chapter06-r668.mjs tests/arkon-chapter05-r666.mjs tests/arkon-chapter04-r659.mjs tests/arkon-chapter-replay-r657.mjs tests/arkonStoryMode.test.mjs tests/story-director-r639.mjs
