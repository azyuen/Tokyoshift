name: R580 Chapter 09 Registration Room
on:
  push:
    paths:
      - 'src/ui/Chapter09EstablishingShot.js'
      - 'src/ui/Chapter09Story.js'
      - 'src/ui/StoryArchivePanel.js'
      - 'src/ui/MangaCutscene.js'
      - 'tests/chapter09-establishing-r579.mjs'
      - '.github/workflows/chapter09-regoroom-r580.yml'
  pull_request:
    paths:
      - 'src/ui/Chapter09EstablishingShot.js'
      - 'src/ui/Chapter09Story.js'
      - 'src/ui/StoryArchivePanel.js'
      - 'src/ui/MangaCutscene.js'
      - 'tests/chapter09-establishing-r579.mjs'
      - '.github/workflows/chapter09-regoroom-r580.yml'
jobs:
  chapter09-stage-and-replays:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed modules
        run: |
          node --check src/ui/Chapter09EstablishingShot.js
          node --check src/ui/Chapter09Story.js
          node --check src/ui/MangaCutscene.js
          node --check src/ui/StoryArchivePanel.js
          node --check src/ui/CutsceneTester.js
          node --check src/scenes/CentralTokyoScene.js
      - name: Chapter 09 rego-room and chapter replay tests
        run: |
          node --test tests/chapter09-establishing-r579.mjs
          node --test tests/chapter09-drag-r577.mjs
          node --test tests/story-archive-r570.mjs
          node --test tests/drag-open-circuit-r575.mjs
          node --test tests/pro-season-forfeit-r576.mjs
