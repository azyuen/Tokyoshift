name: Professional season simulation
on:
  push:
    paths:
      - 'src/data/proSeason.js'
      - 'src/data/proCircuit.js'
      - 'tests/proSeason.simulation.test.js'
      - '.github/workflows/pro-season-simulation.yml'
  workflow_dispatch:
jobs:
  eight-round-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check professional modules
        run: |
          node --check src/data/proSeason.js
          node --check src/data/proCircuit.js
          node --check src/scenes/FourLaneTestScene.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/ui/ProSeasonPanel.js
      - name: Simulate eight-round seasons
        run: node --test tests/proSeason.simulation.test.js
