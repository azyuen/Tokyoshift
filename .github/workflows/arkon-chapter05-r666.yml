name: R666 Arkon Chapter 05 integration
on:
  pull_request:
    paths:
      - 'src/data/arkonChapter05.js'
      - 'src/data/arkonChapter05Races.js'
      - 'src/data/storyDirectorScripts.js'
      - 'src/story/StoryDirector.js'
      - 'src/story/StoryScript.js'
      - 'src/scenes/RaceScene.js'
      - 'src/state/GameState.js'
      - 'src/ui/ArkonStoryObjective.js'
      - 'src/ui/ArkonPlayableReplay.js'
      - 'src/ui/ArkonStoryArchivePanel.js'
      - 'tests/arkon-chapter05-r666.mjs'
  push:
    branches: [main]
    paths:
      - 'src/data/arkonChapter05.js'
      - 'src/data/arkonChapter05Races.js'
      - 'tests/arkon-chapter05-r666.mjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and imports
        run: |
          for file in src/data/arkonChapter05.js src/data/arkonChapter05Races.js src/data/storyDirectorScripts.js src/story/StoryDirector.js src/story/StoryScript.js src/scenes/RaceScene.js src/state/GameState.js src/ui/ArkonStoryObjective.js src/ui/ArkonPlayableReplay.js src/ui/ArkonStoryArchivePanel.js tests/arkon-chapter05-r666.mjs; do node --check "$file"; done
      - name: Run story and loan regressions
        run: |
          node --test tests/arkon-chapter05-r666.mjs tests/arkon-chapter04-r659.mjs tests/arkon-story-polish-r665.mjs tests/arkon-chapter-replay-r657.mjs tests/arkonStoryMode.test.mjs tests/story-director-r639.mjs
