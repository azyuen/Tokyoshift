name: R694 LBWK full works economics and power
on:
  push:
    branches: [main, feature/lbwk-fullworks-balance-r693]
    paths:
      - 'src/data/lbwkFullWorks.js'
      - 'src/data/lbwkConversions.js'
      - 'src/data/lbwkHeroCars.js'
      - 'src/data/endgameHeroCalibration.js'
      - 'src/data/centralTokyo.js'
      - 'src/data/cars.js'
      - 'src/scenes/TunerShopScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/vehicles/VehiclePerformance.js'
      - 'tests/lbwk-fullworks-r694.mjs'
      - '.github/workflows/lbwk-fullworks-r694.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in src/data/lbwkFullWorks.js src/data/lbwkConversions.js src/data/lbwkHeroCars.js src/data/endgameHeroCalibration.js src/data/centralTokyo.js src/data/cars.js src/scenes/TunerShopScene.js src/scenes/CentralTokyoScene.js src/vehicles/VehiclePerformance.js tests/lbwk-fullworks-r694.mjs; do
            node --check "$f"
          done
      - name: Full-works and price regression
        run: node --test tests/lbwk-fullworks-r694.mjs
