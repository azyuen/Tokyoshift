name: Chapter 08 — The Next Level regression
on:
  pull_request:
    paths:
      - 'src/data/chapter08.js'
      - 'src/data/cutscenes.js'
      - 'src/ui/Chapter08Story.js'
      - 'src/ui/SwipePortraitGallery.js'
      - 'src/ui/TravelMap.js'
      - 'src/ui/CutsceneTester.js'
      - 'src/scenes/GarageScene.js'
      - 'src/scenes/RaceScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'tests/chapter08-r568.mjs'
      - '.github/workflows/chapter08-r568.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/chapter08.js'
      - 'src/ui/Chapter08Story.js'
      - 'src/scenes/RaceScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'tests/chapter08-r568.mjs'
  workflow_dispatch:
jobs:
  chapter08:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all Chapter 08 modules for syntax
        run: |
          node --check src/data/chapter08.js
          node --check src/data/cutscenes.js
          node --check src/ui/Chapter08Story.js
          node --check src/ui/SwipePortraitGallery.js
          node --check src/ui/TravelMap.js
          node --check src/ui/CutsceneTester.js
          node --check src/scenes/GarageScene.js
          node --check src/scenes/RaceScene.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/main.js
      - name: Run focused story integration regressions
        run: node --test tests/chapter08-r568.mjs
