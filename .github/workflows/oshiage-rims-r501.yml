name: Oshiage Rims R501
on:
  push:
    paths:
      - 'src/data/oshiageRims.js'
      - 'src/data/visualMods.js'
      - 'src/data/centralTokyo.js'
      - 'src/data/travelRegions.js'
      - 'src/scenes/OshiageScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/GarageScene.js'
      - 'src/state/GameState.js'
      - 'tests/oshiage-rims-r501.mjs'
      - '.github/workflows/oshiage-rims-r501.yml'
  workflow_dispatch:
jobs:
  moved-rims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for src in src/scenes/OshiageScene.js src/scenes/CentralTokyoScene.js src/scenes/GarageScene.js src/data/oshiageRims.js src/data/visualMods.js src/data/centralTokyo.js src/state/GameState.js src/data/travelRegions.js; do
            node --check "$src"
          done
      - name: Existing Oshiage R496
        run: node --test tests/oshiage-r496.mjs
      - name: R501 test 1 - Oshiage displays
        if: always()
        run: node --test --test-name-pattern="Oshiage displays" tests/oshiage-rims-r501.mjs
      - name: R501 test 2 - original rim IDs
        if: always()
        run: node --test --test-name-pattern="original rim IDs" tests/oshiage-rims-r501.mjs
      - name: R501 test 3 - already owned rims
        if: always()
        run: node --test --test-name-pattern="already owned rims" tests/oshiage-rims-r501.mjs
      - name: R501 test 4 - restoring stock rims
        if: always()
        run: node --test --test-name-pattern="restoring stock rims" tests/oshiage-rims-r501.mjs
      - name: R501 test 5 - unaffordable wheels
        if: always()
        run: node --test --test-name-pattern="unaffordable wheels" tests/oshiage-rims-r501.mjs
      - name: R501 test 6 - old bodykits
        if: always()
        run: node --test --test-name-pattern="old bodykits" tests/oshiage-rims-r501.mjs
      - name: R501 test 7 - retired Auto Market
        if: always()
        run: node --test --test-name-pattern="retired Auto Market" tests/oshiage-rims-r501.mjs
      - name: R501 test 8 - Rims is second
        if: always()
        run: node --test --test-name-pattern="Rims is second" tests/oshiage-rims-r501.mjs
