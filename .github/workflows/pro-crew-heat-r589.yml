name: R589 Pro Crew Heat Selection
on:
  pull_request:
    paths:
      - 'src/ui/ProCrewBattleLineup.js'
      - 'src/ui/ProBriefingChrome.js'
      - 'tests/pro-briefing-consistency-r604.mjs'
      - 'tests/pro-briefing-layout-r608.mjs'
      - 'tests/pro-briefing-unified-heat-r609.mjs'
      - 'tests/pro-briefing-lifecycle-r605.mjs'
      - 'src/ui/ProSeasonPanel.js'
      - 'src/data/proSeason.js'
      - 'tests/pro-crew-heat-r589.mjs'
      - 'tests/pro-crew-r591.mjs'
      - 'tests/pro-crew-continuous-r594.mjs'
      - 'tests/pro-crew-visual-r596.mjs tests/pro-briefing-consistency-r604.mjs tests/pro-briefing-layout-r608.mjs tests/pro-briefing-lifecycle-r605.mjs'
      - 'src/scenes/FourLaneTestScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/data/proCircuit.js'
      - '.github/workflows/pro-crew-heat-r589.yml'
  push:
    branches: [main]
    paths:
      - 'src/ui/ProCrewBattleLineup.js'
      - 'src/ui/ProBriefingChrome.js'
      - 'tests/pro-briefing-consistency-r604.mjs'
      - 'tests/pro-briefing-layout-r608.mjs'
      - 'tests/pro-briefing-unified-heat-r609.mjs'
      - 'tests/pro-briefing-lifecycle-r605.mjs'
      - 'src/ui/ProSeasonPanel.js'
      - 'src/data/proSeason.js'
      - 'tests/pro-crew-heat-r589.mjs'
      - 'tests/pro-crew-r591.mjs'
      - 'tests/pro-crew-continuous-r594.mjs'
      - 'tests/pro-crew-visual-r596.mjs tests/pro-briefing-consistency-r604.mjs tests/pro-briefing-layout-r608.mjs tests/pro-briefing-lifecycle-r605.mjs'
      - 'src/scenes/FourLaneTestScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/data/proCircuit.js'
jobs:
  pro-crew-heat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse production UI and circuit modules
        run: |
          node --check src/ui/ProCrewBattleLineup.js
          node --check src/ui/ProBriefingChrome.js
          node --check src/ui/ProSeasonPanel.js
          node --check src/data/proSeason.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/scenes/FourLaneTestScene.js
      - name: Verify saved seven-driver crew and once-per-event advice
        run: node --test tests/pro-crew-heat-r589.mjs tests/pro-crew-r591.mjs tests/pro-crew-continuous-r594.mjs tests/pro-crew-visual-r596.mjs tests/pro-briefing-consistency-r604.mjs tests/pro-briefing-layout-r608.mjs tests/pro-briefing-unified-heat-r609.mjs tests/pro-briefing-lifecycle-r605.mjs
