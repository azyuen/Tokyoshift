name: R728 Sayaka advice across all heats and trophy cooldown

on:
  pull_request:
    paths:
      - 'src/data/proDriverBriefing.js'
      - 'src/data/proSeason.js'
      - 'src/ui/ProDriverBriefing.js'
      - 'src/ui/ProCrewBattleLineup.js'
      - 'src/ui/ProSeasonPanel.js'
      - 'tests/sayaka-event-advice-r728.mjs'
      - 'tests/open-driver-briefing-r600.mjs'
      - 'tests/pro-between-heats-r727.mjs'
      - 'tests/pro-briefing-lifecycle-r605.mjs'
      - '.github/workflows/sayaka-event-advice-r728.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/proDriverBriefing.js'
      - 'src/data/proSeason.js'
      - 'src/ui/ProDriverBriefing.js'
      - 'src/ui/ProCrewBattleLineup.js'
      - 'src/ui/ProSeasonPanel.js'
      - 'tests/sayaka-event-advice-r728.mjs'

jobs:
  sayaka-event-advice-r728:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verification
        run: |
          node --check src/data/proDriverBriefing.js
          node --check src/data/proSeason.js
          node --check src/ui/ProDriverBriefing.js
          node --check src/ui/ProCrewBattleLineup.js
          node --check src/ui/ProSeasonPanel.js
      - name: Heat-sensitive advice and trophy cooldown contract
        run: node --test tests/sayaka-event-advice-r728.mjs
      - name: Existing between-heats and interaction compatibility
        # Legacy R589/R600/R605 node tests also exercise unrelated Phaser
        # runtime/obsolete layout assumptions and aren't reliable in CI.
        run: node --test tests/pro-between-heats-r727.mjs tests/drag-briefing-interactions-r607.mjs
