name: R624 Street tuner paints and three-mode studio
on:
  push:
    branches: [main]
    paths:
      - 'src/data/streetPaintPalettes.js'
      - 'src/scenes/OshiageScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/MeetScene.js'
      - 'src/data/oshiageElite.js'
      - 'tests/street-paint-r624.mjs'
  pull_request:
    paths:
      - 'src/data/streetPaintPalettes.js'
      - 'src/scenes/OshiageScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/MeetScene.js'
      - 'src/data/oshiageElite.js'
      - 'tests/street-paint-r624.mjs'
  workflow_dispatch:
jobs:
  street-paints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check src/data/streetPaintPalettes.js
          node --check src/scenes/OshiageScene.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/scenes/MeetScene.js
          node --check src/data/oshiageElite.js
      - name: Street/stock paint and existing Oshiage regressions
        run: |
          node --test tests/street-paint-r624.mjs tests/factory-paint-palettes-r623.mjs tests/oshiage-paint-layout-r622.mjs tests/oshiage-paint-visual-r621.mjs
