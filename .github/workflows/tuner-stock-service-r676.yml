name: R676 Factory tune service and recruitment matching
on:
  push:
    branches: [main]
    paths:
      - 'src/data/stockTuneService.js'
      - 'src/data/crewSystem.js'
      - 'src/scenes/TunerShopScene.js'
      - 'src/scenes/GarageScene.js'
      - 'src/scenes/MeetScene.js'
      - 'tests/tuner-stock-service-r676.mjs'
      - '.github/workflows/tuner-stock-service-r676.yml'
  workflow_dispatch:
jobs:
  stock-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check src/data/stockTuneService.js
          node --check src/data/crewSystem.js
          node --check src/scenes/TunerShopScene.js
          node --check src/scenes/GarageScene.js
          node --check src/scenes/MeetScene.js
          node --check src/main.js
          node --check tests/tuner-stock-service-r676.mjs
      - name: Tune, crew eligibility and save regressions
        run: |
          node --test tests/tuner-stock-service-r676.mjs tests/crew-recruit-easy-ai-r618.mjs tests/crew-regulations-uninstall-r619.mjs tests/crew-global-recruit-pity-r551.mjs
