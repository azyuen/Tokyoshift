name: R459 Shibuya sprite path integrity

on:
  push:
    branches: [main]
    paths:
      - 'assets/Characters/Shibuya/**'
      - 'src/data/characters.js'
      - 'tests/shibuya-asset-rename-r459.mjs'
      - '.github/workflows/shibuya-asset-rename-r459.yml'
  pull_request:
    paths:
      - 'assets/Characters/Shibuya/**'
      - 'src/data/characters.js'
      - 'tests/shibuya-asset-rename-r459.mjs'
      - '.github/workflows/shibuya-asset-rename-r459.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/data/characters.js
      - run: node --test tests/shibuya-asset-rename-r459.mjs tests/character-control-assets-r458.mjs tests/sayaka-reika-continuity.mjs
