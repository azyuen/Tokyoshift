name: Game regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/regression-selection.mjs
      - name: GC8 tuner state and car-selection regression
        run: node --test tests/tuner-gc8-state-consistency-20261108.mjs
      - name: Tuner purchase manga confirmations
        run: node --test tests/tuner-purchase-manga-20261108.mjs tests/tuner-hero-conversions-r521.mjs tests/tuner-stock-service-r676.mjs
      - name: Championship AI garages and performance benchmark
        run: |
          node --test tests/tokyo-championship-ai-garages-20261107.mjs
          node --test tests/tokyo-championship-performance-20261107.mjs
      - name: Run affected regression suites (all on manual dispatch)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            node scripts/run-regressions.mjs
          else
            node scripts/run-regressions.mjs --base "$BASE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-artifacts
          path: |
            artifacts/
            /tmp/*audit*.json
            /tmp/*audit*.md
          if-no-files-found: ignore
