name: R678 Aruken J-drama Story Revision
on:
  pull_request:
    paths:
      - 'src/data/arkonChapter*.js'
      - 'src/data/storyDirectorScripts.js'
      - 'src/ui/ArkonStory*.js'
      - 'src/ui/ArkonPlayableReplay.js'
      - 'src/story/**'
      - 'src/scenes/TunerShopScene.js'
      - 'tests/arkon-story-r678.mjs'
      - 'tests/arkonStoryMode.test.mjs'
      - 'tests/arkon-chapter07-r669.mjs'
  push:
    branches: [main]
    paths:
      - 'src/data/arkonChapter*.js'
      - 'tests/arkon-story-r678.mjs'
jobs:
  story-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in src/data/arkonChapter01Revised.js src/data/arkonChapter02.js src/data/arkonChapter03.js src/data/arkonChapter04.js src/data/arkonChapter05.js src/data/arkonChapter07.js src/data/arkonChapter07Progress.js src/data/storyDirectorScripts.js src/story/StoryDirector.js src/ui/ArkonStoryObjective.js src/ui/ArkonStoryArchivePanel.js src/scenes/TunerShopScene.js tests/arkon-story-r678.mjs; do node --check "$file"; done
      - name: Aruken story, regional specialists and save regressions
        run: |
          node --test tests/arkon-story-r678.mjs tests/arkonStoryMode.test.mjs tests/arkon-chapter02-r655.mjs tests/arkon-chapter03-r656.mjs tests/arkon-chapter04-r659.mjs tests/arkon-chapter05-r666.mjs tests/arkon-chapter07-r669.mjs tests/arkon-chapter08-r672.mjs tests/arkon-chapter09-r673.mjs tests/arkon-chapter10-r674.mjs
