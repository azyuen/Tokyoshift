name: Bootstrap TOKYO SHIFT source

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct prototype
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/part00 .deploy/part01 .deploy/part02 .deploy/part03 .deploy/part04 .deploy/part05 .deploy/part06 .deploy/part07 > /tmp/tokyo-shift.b64
          base64 --decode /tmp/tokyo-shift.b64 > /tmp/tokyo-shift.zip
          unzip -t /tmp/tokyo-shift.zip
          rm -rf /tmp/tokyo-shift-unpack
          mkdir -p /tmp/tokyo-shift-unpack
          unzip -q /tmp/tokyo-shift.zip -d /tmp/tokyo-shift-unpack
          cp -a /tmp/tokyo-shift-unpack/tokyo-shift/. .
          rm -rf .deploy
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy TOKYO SHIFT Phase 1 prototype"
          git push
