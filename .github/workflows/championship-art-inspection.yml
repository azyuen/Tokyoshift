name: R802 temporary Championship art inspection
on:
  push:
    branches: [feature/championship-monitors-dev-entry-r802]
    paths:
      - '.github/workflows/championship-art-inspection.yml'
jobs:
  preview-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image analysis
        run: python3 -m pip install --quiet Pillow
      - name: Print small previews for assisted alignment
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,io
          from PIL import Image
          for key in ('hub','knockouts'):
            path=f'assets/CentralTokyo/dragcomplex/championship_{key}.png'
            im=Image.open(path).convert('RGB')
            print('IMAGE_SIZE_'+key.upper()+'='+str(im.size))
            im.thumbnail((850,480))
            dst=io.BytesIO()
            im.save(dst,format='JPEG',quality=69,optimize=True)
            print('ART_PREVIEW_'+key.upper()+'='+base64.b64encode(dst.getvalue()).decode('ascii'))
          PY
