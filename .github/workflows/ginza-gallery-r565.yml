name: Ginza gallery regression and layout checks
on:
  pull_request:
    paths:
      - 'src/data/ginzaGallery.js'
      - 'src/data/ginzaScenes.js'
      - 'src/data/ginzaBanter.js'
      - 'src/data/ginzaLoanAccess.js'
      - 'src/data/specialProfileRewards.js'
      - 'src/ui/GinzaBanterHud.js'
      - 'src/data/characters.js'
      - 'src/data/cars.js'
      - 'src/data/proSeason.js'
      - 'src/state/GameState.js'
      - 'src/scenes/GarageScene.js'
      - 'src/scenes/CharacterSelectScene.js'
      - 'src/ui/MangaCutscene.js'
      - 'src/data/oshiageShowdown.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/MeetScene.js'
      - 'src/scenes/OshiageScene.js'
      - 'src/scenes/GarageScene.js'
      - 'src/scenes/CharacterSelectScene.js'
      - 'src/ui/MangaCutscene.js'
      - 'src/data/oshiageShowdown.js'
      - 'src/state/GameState.js'
      - 'src/ui/TravelMap.js'
      - 'src/scenes/RaceScene.js'
      - 'tests/ginza-gallery-r565.mjs'
      - 'tests/ginza-gallery-r566.mjs'
      - 'tests/ginza-gallery-r567.mjs'
      - 'tests/ginza-arkon-private-gallery-r629.mjs'
      - 'tests/ginza-banter-r633.mjs'
      - 'tests/ginza-banter-expressions-r634.mjs'
      - 'tests/ginza-loan-return-r636.mjs'
      - 'tests/ginza-arkon-showdowns-r637.mjs'
      - 'tests/tokyo-r638-polish.mjs'
      - '.github/workflows/ginza-gallery-r565.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/ginzaGallery.js'
      - 'src/data/ginzaScenes.js'
      - 'src/data/ginzaBanter.js'
      - 'src/data/ginzaLoanAccess.js'
      - 'src/data/specialProfileRewards.js'
      - 'src/data/characters.js'
      - 'src/ui/GinzaBanterHud.js'
      - 'src/data/proSeason.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/RaceScene.js'
      - 'src/scenes/MeetScene.js'
      - 'src/scenes/OshiageScene.js'
      - 'src/scenes/GarageScene.js'
      - 'src/scenes/CharacterSelectScene.js'
      - 'src/ui/MangaCutscene.js'
      - 'src/data/oshiageShowdown.js'
      - 'src/state/GameState.js'
      - 'src/ui/TravelMap.js'
      - 'assets/Characters/Dev/**'
      - 'tests/ginza-gallery-r565.mjs'
      - 'tests/ginza-gallery-r566.mjs'
      - 'tests/ginza-gallery-r567.mjs'
      - 'tests/ginza-arkon-private-gallery-r629.mjs'
      - 'tests/ginza-banter-r633.mjs'
      - 'tests/ginza-banter-expressions-r634.mjs'
      - 'tests/ginza-loan-return-r636.mjs'
      - 'tests/ginza-arkon-showdowns-r637.mjs'
      - 'tests/tokyo-r638-polish.mjs'
      - '.github/workflows/ginza-gallery-r565.yml'
  workflow_dispatch:
jobs:
  ginza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/scenes/CentralTokyoScene.js
      - run: node --check src/scenes/RaceScene.js
      - run: node --check src/scenes/MeetScene.js
      - run: node --check src/data/ginzaGallery.js
      - run: node --check src/data/ginzaScenes.js
      - run: node --check src/data/ginzaBanter.js
      - run: node --check src/data/ginzaLoanAccess.js
      - run: node --check src/data/specialProfileRewards.js
      - run: node --check src/data/oshiageShowdown.js
      - run: node --check src/scenes/GarageScene.js
      - run: node --check src/scenes/CharacterSelectScene.js
      - run: node --check src/ui/MangaCutscene.js
      - run: node --check src/ui/TravelMap.js
      - run: node --check src/scenes/OshiageScene.js
      - run: node --check src/ui/GinzaBanterHud.js
      - run: node --check src/data/characters.js
      - run: node --check src/data/cars.js
      - run: node --check src/state/GameState.js
      - run: node --test tests/ginza-gallery-r565.mjs tests/ginza-gallery-r566.mjs tests/ginza-gallery-r567.mjs tests/ginza-arkon-private-gallery-r629.mjs tests/ginza-banter-r633.mjs tests/ginza-banter-expressions-r634.mjs tests/ginza-loan-return-r636.mjs tests/ginza-arkon-showdowns-r637.mjs tests/tokyo-r638-polish.mjs
