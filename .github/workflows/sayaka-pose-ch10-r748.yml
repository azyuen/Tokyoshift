name: R748 Sayaka poses and Chapter 10 post-championship finale
on:
  push:
    branches: [main, feature/ch10-timejump-sayaka-poses-r748]
    paths:
      - 'src/data/characters.js'
      - 'src/data/arkonChapter10.js'
      - 'src/data/cutscenes.js'
      - 'src/story/ArukenPresentation.js'
      - 'src/story/ArkonR748CheckpointMigration.js'
      - 'src/story/StoryDirector.js'
      - 'src/story/StoryScript.js'
      - 'src/ui/ArkonStoryTimeJump.js'
      - 'tests/sayaka-pose-ch10-r748.mjs'
      - 'tests/arkon-chapter10-r674.mjs'
      - 'tests/arkon-chapter10-r679.mjs'
      - 'tests/arkon-ch01-sayaka-uniform-r686.mjs'
      - '.github/workflows/sayaka-pose-ch10-r748.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          for f in src/data/characters.js src/data/arkonChapter10.js src/data/cutscenes.js src/story/ArukenPresentation.js src/story/ArkonR748CheckpointMigration.js src/story/StoryDirector.js src/story/StoryScript.js src/ui/ArkonStoryTimeJump.js tests/sayaka-pose-ch10-r748.mjs; do node --check "$f"; done
      - name: Focused full pose and Prelude/Career continuity
        run: |
          node --test tests/sayaka-pose-ch10-r748.mjs tests/arkon-chapter10-r674.mjs tests/arkon-chapter10-r679.mjs tests/arkon-ch01-sayaka-uniform-r686.mjs tests/career-continuity-r680.mjs tests/chapter08-09-wardrobe-r646.mjs tests/sayaka-post-ch09-voice.mjs tests/opening-chapter-r467.mjs
