name: R564 scene gallery and phone-call UI regression
on:
  pull_request:
    paths:
      - 'src/ui/SwipePortraitGallery.js'
      - 'src/data/cutscenes.js'
      - 'src/ui/RaceCoachHud.js'
      - 'src/ui/OpeningPhonePrototype.js'
      - 'src/ui/PhoneConversation.js'
      - 'src/scenes/MeetScene.js'
      - 'tests/scene-phone-meet-r564.mjs'
      - '.github/workflows/scene-phone-meet-r564.yml'
  push:
    branches: [main]
    paths:
      - 'src/ui/SwipePortraitGallery.js'
      - 'src/data/cutscenes.js'
      - 'src/ui/RaceCoachHud.js'
      - 'src/ui/OpeningPhonePrototype.js'
      - 'src/ui/PhoneConversation.js'
      - 'src/scenes/MeetScene.js'
      - 'tests/scene-phone-meet-r564.mjs'
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/ui/SwipePortraitGallery.js
      - run: node --check src/ui/RaceCoachHud.js
      - run: node --check src/ui/OpeningPhonePrototype.js
      - run: node --check src/ui/PhoneConversation.js
      - run: node --check src/scenes/MeetScene.js
      - run: node --check src/data/cutscenes.js
      - run: node --test tests/scene-phone-meet-r564.mjs
