name: R646 Chapter 8/9 Cinematic Wardrobe and Meet UI
on:
  pull_request:
    paths:
      - 'src/data/chapter08.js'
      - 'src/data/chapter09.js'
      - 'src/ui/Chapter08Story.js'
      - 'src/ui/Chapter08GinzaRevealStage.js'
      - 'src/ui/Chapter09Story.js'
      - 'src/ui/Chapter09EstablishingShot.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/MeetScene.js'
      - 'tests/chapter08-09-wardrobe-r646.mjs'
      - 'tests/meet-progression-actions-r550.mjs'
      - '.github/workflows/chapter08-09-wardrobe-r646.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/chapter08.js'
      - 'src/data/chapter09.js'
      - 'src/ui/Chapter08Story.js'
      - 'src/ui/Chapter08GinzaRevealStage.js'
      - 'src/ui/Chapter09Story.js'
      - 'src/ui/Chapter09EstablishingShot.js'
      - 'src/scenes/MeetScene.js'
      - 'tests/chapter08-09-wardrobe-r646.mjs'
  workflow_dispatch:
jobs:
  cinematic-wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse changed gameplay and cinematic modules
        run: |
          node --check src/data/chapter08.js
          node --check src/data/chapter09.js
          node --check src/ui/Chapter08Story.js
          node --check src/ui/Chapter08GinzaRevealStage.js
          node --check src/ui/Chapter09Story.js
          node --check src/ui/Chapter09EstablishingShot.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/scenes/MeetScene.js
      - name: Verify wardrobe reveal, progression, and existing stories
        run: |
          node --test tests/chapter08-09-wardrobe-r646.mjs tests/meet-progression-actions-r550.mjs tests/chapter08-r568.mjs tests/chapter08-dev-replay-r569.mjs tests/chapter09-establishing-r579.mjs tests/chapter09-portrait-stage-r585.mjs
