name: R643 Story arrival, pacing and perspective
on:
  workflow_dispatch:
  push:
    branches: [main, fix/story-arrival-and-pacing-r643]
    paths:
      - 'src/ui/StoryContinuePrompt.js'
      - 'src/ui/StoryComposition.js'
      - 'src/data/devVaultStory.js'
      - 'src/data/storyDirectorScripts.js'
      - 'src/story/StoryScript.js'
      - 'src/story/StoryDirector.js'
      - 'src/scenes/DevVaultStoryScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/MeetScene.js'
      - 'src/scenes/RaceScene.js'
      - 'tests/story-arrival-pacing-r643.mjs'
      - '.github/workflows/story-arrival-pacing-r643.yml'
jobs:
  story-arrival:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/ui/StoryContinuePrompt.js
          node --check src/ui/StoryComposition.js
          node --check src/data/devVaultStory.js
          node --check src/data/storyDirectorScripts.js
          node --check src/story/StoryScript.js
          node --check src/story/StoryDirector.js
          node --check src/scenes/DevVaultStoryScene.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/scenes/MeetScene.js
          node --check src/scenes/RaceScene.js
          node --check src/main.js
      - name: Story arrival, choice and cross-scene regressions
        run: |
          node --test tests/story-arrival-pacing-r643.mjs tests/story-composition-arrival-r642.mjs tests/dev-vault-story-r641.mjs tests/story-director-r639.mjs tests/ginza-loan-return-r636.mjs tests/startup-import-integrity-r508.mjs
