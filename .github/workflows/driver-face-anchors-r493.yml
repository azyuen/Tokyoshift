name: Driver face anchors regression

on:
  pull_request:
    paths:
      - 'src/characters/CharacterFaceAnchor.js'
      - 'src/characters/CharacterProfileRenderer.js'
      - 'src/data/carDriverFaceAnchors.js'
      - 'src/data/cars.js'
      - 'src/vehicles/DriverSilhouette.js'
      - 'src/scenes/RaceScene.js'
      - 'tests/driver-face-anchors.mjs'
  push:
    branches:
      - fix/driver-face-anchors-r493

jobs:
  drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check driver and portrait syntax
        run: |
          node --check src/characters/CharacterFaceAnchor.js
          node --check src/characters/CharacterProfileRenderer.js
          node --check src/data/carDriverFaceAnchors.js
          node --check src/data/cars.js
          node --check src/vehicles/DriverSilhouette.js
          node --check src/scenes/RaceScene.js
      - name: Check race/car regression
        run: node --test tests/driver-face-anchors.mjs tests/car-reference-rollout.mjs tests/car-reference-geometry.mjs
