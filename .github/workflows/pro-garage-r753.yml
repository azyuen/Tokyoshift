name: Pro Garage three-car paddock R753
on:
  pull_request:
    paths:
      - 'src/data/proGarage.js'
      - 'src/data/proCircuit.js'
      - 'src/data/workshopProgression.js'
      - 'src/scenes/GarageScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/ui/ProSeasonPanel.js'
      - 'tests/pro-garage-paddock-r753.mjs'
      - 'tests/r754-pro-garage-open-drivetrain.mjs'
      - 'src/data/carMagazine.js'
      - '.github/workflows/pro-garage-r753.yml'
  push:
    branches: [main, feature/pro-season-paddock-r753]
  workflow_dispatch:
jobs:
  paddock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Pro Garage module syntax
        run: |
          node --check src/data/proGarage.js
          node --check src/data/proCircuit.js
          node --check src/data/carMagazine.js
          node --check src/data/workshopProgression.js
          node --check src/ui/ProSeasonPanel.js
          node --check src/scenes/GarageScene.js
          node --check src/scenes/CentralTokyoScene.js
      - name: Paddock, previous season, workshop and championship regressions
        run: |
          node --test tests/pro-garage-paddock-r753.mjs tests/pro-drag-season-roster-20261101.mjs tests/r754-pro-garage-open-drivetrain.mjs
          node --test tests/proSeason.simulation.test.js tests/tokyoChampionship.simulation.test.js
