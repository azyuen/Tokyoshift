name: R670 Chapter 05 meet staging and pacing
on:
  pull_request:
    paths:
      - 'src/data/arkonChapter05.js'
      - 'src/ui/StoryStage.js'
      - 'src/ui/StoryContinuePrompt.js'
      - 'src/story/StoryDirector.js'
      - 'src/story/StoryScript.js'
      - 'src/story/Chapter05MeetLayout.js'
      - 'src/state/GameState.js'
      - 'tests/arkon-chapter05-meets-r670.mjs'
  push:
    branches: [main]
    paths:
      - 'src/data/arkonChapter05.js'
      - 'tests/arkon-chapter05-meets-r670.mjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Changed file syntax
        run: |
          for file in src/data/arkonChapter05.js src/ui/StoryStage.js src/ui/StoryContinuePrompt.js src/story/StoryDirector.js src/story/StoryScript.js src/story/Chapter05MeetLayout.js src/state/GameState.js tests/arkon-chapter05-meets-r670.mjs; do node --check "$file"; done
      - name: Chapter 05 and Story regression tests
        run: |
          node --test tests/arkon-chapter05-meets-r670.mjs tests/arkon-chapter05-r666.mjs tests/arkon-chapter06-r668.mjs tests/arkon-story-polish-r665.mjs tests/arkon-chapter-replay-r657.mjs tests/arkonStoryMode.test.mjs tests/story-director-r639.mjs
