name: R621 Oshiage paint room visual regression
on:
  pull_request:
    paths:
      - 'src/scenes/OshiageScene.js'
      - 'src/main.js'
      - 'tests/oshiage-paint-visual-r621.mjs'
      - '.github/workflows/oshiage-paint-visual-r621.yml'
  workflow_dispatch:
jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/scenes/OshiageScene.js
          node --check src/main.js
          node --check tests/oshiage-paint-visual-r621.mjs
      - name: Paint room and crew integration regressions
        run: node --test tests/oshiage-paint-visual-r621.mjs tests/crew-oshiage-chassis-r615.mjs
