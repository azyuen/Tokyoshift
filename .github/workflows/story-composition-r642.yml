name: R642 reusable story composition and immediate arrival
on:
  workflow_dispatch:
  push:
    branches: [main, fix/story-composition-arrival-r642]
    paths:
      - 'src/ui/StoryComposition.js'
      - 'src/ui/StoryCarRenderer.js'
      - 'src/ui/StoryStage.js'
      - 'src/scenes/DevVaultStoryScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/scenes/MeetScene.js'
      - 'src/story/StoryDirector.js'
      - 'src/story/StoryScript.js'
      - 'src/data/devVaultStory.js'
      - 'src/data/storyDirectorScripts.js'
      - 'src/state/GameState.js'
      - 'tests/story-composition-arrival-r642.mjs'
      - 'tests/dev-vault-story-r641.mjs'
      - 'tests/story-director-r639.mjs'
      - '.github/workflows/story-composition-r642.yml'
jobs:
  staging-and-arrival:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static module integrity
        run: |
          node --check src/ui/StoryComposition.js
          node --check src/ui/StoryCarRenderer.js
          node --check src/ui/StoryStage.js
          node --check src/scenes/DevVaultStoryScene.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/scenes/MeetScene.js
          node --check src/story/StoryDirector.js
          node --check src/story/StoryScript.js
          node --check src/data/devVaultStory.js
          node --check src/data/storyDirectorScripts.js
          node --check src/state/GameState.js
          node --check src/main.js
      - name: Story composition, choice persistence and regression suite
        run: |
          node --test tests/story-composition-arrival-r642.mjs tests/dev-vault-story-r641.mjs tests/story-director-r639.mjs tests/ginza-loan-return-r636.mjs tests/ginza-banter-r633.mjs tests/startup-import-integrity-r508.mjs
