name: R695 Ginza Denzaki permanent collector listing
on:
  push:
    branches: [main, fix/ginza-aruken240z-permanent-r695]
    paths:
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/main.js'
      - 'src/data/centralTokyo.js'
      - 'src/data/ginzaGallery.js'
      - 'tests/ginza-denzaki-permanent-r695.mjs'
      - 'tests/lbwk-fullworks-r694.mjs'
      - '.github/workflows/ginza-denzaki-r695.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/scenes/CentralTokyoScene.js
          node --check tests/ginza-denzaki-permanent-r695.mjs
      - name: Ginza one-off, collector and room navigation regressions
        run: |
          node --test tests/ginza-denzaki-permanent-r695.mjs tests/lbwk-fullworks-r694.mjs tests/ginza-gallery-r565.mjs tests/ginza-gallery-r566.mjs tests/ginza-gallery-r567.mjs
