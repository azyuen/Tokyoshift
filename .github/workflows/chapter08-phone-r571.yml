name: R571 Chapter 08 vibrating incoming calls
on:
  pull_request:
    paths:
      - 'src/data/chapter08.js'
      - 'src/data/cutscenes.js'
      - 'src/ui/MangaCutscene.js'
      - 'src/ui/Chapter08Story.js'
      - 'src/ui/CutsceneTester.js'
      - 'tests/chapter08-phone-r571.mjs'
      - '.github/workflows/chapter08-phone-r571.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/chapter08.js'
      - 'tests/chapter08-phone-r571.mjs'
  workflow_dispatch:
jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and incoming-call playback
        run: |
          node --check src/data/chapter08.js
          node --check src/data/cutscenes.js
          node --check src/ui/Chapter08Story.js
          node --check src/ui/MangaCutscene.js
          node --check src/ui/CutsceneTester.js
          node --check src/ui/OpeningPhonePrototype.js
          node --check src/ui/PhoneConversation.js
          node --check src/scenes/GarageScene.js
          node --check src/scenes/CentralTokyoScene.js
          node --check src/scenes/RaceScene.js
      - name: Run both phone animation and full chapter regressions
        run: node --test tests/chapter08-phone-r571.mjs tests/chapter08-r568.mjs tests/chapter08-dev-replay-r569.mjs tests/story-archive-r570.mjs
