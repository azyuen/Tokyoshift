name: Sayaka and Reika character continuity R457

on:
  push:
    branches: [main]
    paths:
      - 'src/data/characters.js'
      - 'src/data/crewRoster.js'
      - 'src/data/cutscenes.js'
      - 'src/scenes/MeetScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/state/GameState.js'
      - 'tests/sayaka-reika-continuity.mjs'
      - '.github/workflows/sayaka-reika-r457.yml'
  pull_request:
    paths:
      - 'src/data/characters.js'
      - 'src/data/crewRoster.js'
      - 'src/data/cutscenes.js'
      - 'src/scenes/MeetScene.js'
      - 'src/scenes/CentralTokyoScene.js'
      - 'src/state/GameState.js'
      - 'tests/sayaka-reika-continuity.mjs'
      - '.github/workflows/sayaka-reika-r457.yml'

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check character and scene JavaScript syntax
        run: |
          node --check src/data/characters.js
          node --check src/data/crewRoster.js
          node --check src/data/cutscenes.js
          node --check src/state/GameState.js
          node --check src/scenes/MeetScene.js
          node --check src/scenes/CentralTokyoScene.js
      - name: Check Sayaka-Reika continuity and old saves
        run: node --test tests/sayaka-reika-continuity.mjs tests/pro-circuit-foundation.mjs
