<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070914" />
  <meta name="application-name" content="Tokyo SHIFT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tokyo SHIFT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./app-icon.svg?v=20260921-r64" />
  <link rel="icon" href="./app-icon.svg?v=20260921-r64" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260921-r64" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Tokyo SHIFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Silkscreen:wght@400;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260921-r64" />
</head>
<body>
  <div id="game-shell">
    <div id="game"></div>
    <div id="build-stamp">R64</div>
    <div id="rotate-message">Rotate your phone to landscape to race.</div>
  </div>
  <script>
    async function requestLandscapeMode() {
      if (!screen.orientation?.lock) return false;

      // Browsers may reject orientation locking when the OS rotation lock is on.
      // Try the concrete landscape orientation first, then the generic mode.
      for (const mode of ['landscape-primary', 'landscape']) {
        try {
          await screen.orientation.lock(mode);
          return true;
        } catch (e) {}
      }
      return false;
    }

    window.addEventListener('load', requestLandscapeMode);
    document.addEventListener('pointerdown', requestLandscapeMode, { once: true });

    (async () => {
      try {
        const response = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        const info = await response.json();
        const current = localStorage.getItem('tokyoShiftBuild');

        if (current && current !== info.build) {
          localStorage.setItem('tokyoShiftBuild', info.build);
          const url = new URL(location.href);
          url.searchParams.set('build', info.build);
          url.searchParams.set('_', Date.now().toString());
          location.replace(url.toString());
          return;
        }

        if (!current) localStorage.setItem('tokyoShiftBuild', info.build);
      } catch (e) {}

      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js?v=R64', { updateViaCache: 'none' });
          reg.update();
        } catch (e) {}
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js?v=20260921-r64"></script>
</body>
</html>
