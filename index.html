<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070914" />
  <meta name="application-name" content="Tokyo SHIFT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tokyo SHIFT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./app-icon.svg?v=20260922-r112" />
  <link rel="icon" href="./app-icon.svg?v=20260922-r112" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260922-r112" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Tokyo SHIFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Silkscreen:wght@400;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260922-r119" />
</head>
<body>
  <div id="game-shell">
    <div id="loading-screen" role="status" aria-live="polite" aria-label="Tokyo SHIFT loading">
      <div class="loading-atmosphere" aria-hidden="true"></div>
      <div class="loading-panel">
        <img class="loading-logo" src="./app-icon.svg?v=20260922-r112" alt="" />
        <div class="loading-title">TOKYO <strong>SHIFT</strong></div>
        <div class="loading-kicker">TOKYO AFTER DARK</div>
        <div class="loading-track" aria-hidden="true">
          <div id="loading-bar"></div>
        </div>
        <div class="loading-meta">
          <span id="loading-label">INITIALISING</span>
          <span id="loading-percent">3%</span>
        </div>
      </div>
    </div>
    <div id="game">
      <div id="driver-name-overlay" aria-hidden="true">
        <input
          id="driverFirstName"
          class="driver-name-input"
          maxlength="16"
          autocomplete="given-name"
          inputmode="text"
          autocapitalize="words"
          spellcheck="false"
          placeholder="First name"
          aria-label="First name"
        />
        <input
          id="driverLastName"
          class="driver-name-input"
          maxlength="16"
          autocomplete="family-name"
          inputmode="text"
          autocapitalize="words"
          spellcheck="false"
          placeholder="Last name"
          aria-label="Last name"
        />
      </div>
    </div>
    <div id="build-stamp">R137</div>
    <div id="rotate-message">Rotate your phone to landscape to race.</div>
  </div>
  <script>
    let landscapeLocked = false;

    window.TOKYO_SHIFT_SET_LOADING = (value = 0, label = '') => {
      const clamped = Math.max(0, Math.min(1, Number(value) || 0));
      const bar = document.getElementById('loading-bar');
      const percent = document.getElementById('loading-percent');
      const status = document.getElementById('loading-label');

      if (bar) bar.style.width = Math.max(3, Math.round(clamped * 100)) + '%';
      if (percent) percent.textContent = Math.round(clamped * 100) + '%';
      if (status && label) status.textContent = String(label).toUpperCase();
    };

    window.TOKYO_SHIFT_SHOW_SPLASH = (label = 'LOADING') => {
      const splash = document.getElementById('loading-screen');
      if (!splash) return;
      splash.classList.remove('is-hidden');
      splash.removeAttribute('aria-hidden');
      window.TOKYO_SHIFT_SET_LOADING?.(0.03, label);
    };

    window.TOKYO_SHIFT_HIDE_SPLASH = () => {
      const splash = document.getElementById('loading-screen');
      if (!splash || splash.classList.contains('is-hidden')) return;
      splash.classList.add('is-hidden');
      window.setTimeout(() => splash.setAttribute('aria-hidden', 'true'), 520);
    };

    window.TOKYO_SHIFT_SHOW_SPLASH?.('INITIALISING');

    function syncVirtualLandscape() {
      const viewport = window.visualViewport;
      const width = Math.max(1, viewport?.width || window.innerWidth || document.documentElement.clientWidth);
      const height = Math.max(1, viewport?.height || window.innerHeight || document.documentElement.clientHeight);

      // Feed the exact live viewport dimensions to CSS. iOS PWAs can keep a
      // portrait layout viewport while the device is physically sideways and
      // portrait lock is enabled; relying only on @media orientation misses
      // that state.
      document.documentElement.style.setProperty('--ts-vw', width + 'px');
      document.documentElement.style.setProperty('--ts-vh', height + 'px');
      document.documentElement.classList.toggle('force-landscape', height > width);
    }

    async function requestLandscapeMode() {
      syncVirtualLandscape();
      if (landscapeLocked || !screen.orientation?.lock) return false;

      for (const mode of ['landscape-primary', 'landscape']) {
        try {
          await screen.orientation.lock(mode);
          landscapeLocked = true;
          syncVirtualLandscape();
          return true;
        } catch (e) {}
      }
      return false;
    }

    syncVirtualLandscape();
    window.addEventListener('load', () => {
      syncVirtualLandscape();
      requestLandscapeMode();
    });
    window.addEventListener('resize', syncVirtualLandscape);
    window.addEventListener('orientationchange', () => setTimeout(syncVirtualLandscape, 80));
    window.addEventListener('pageshow', syncVirtualLandscape);
    window.visualViewport?.addEventListener('resize', syncVirtualLandscape);
    document.addEventListener('pointerdown', () => {
      if (!landscapeLocked) requestLandscapeMode();
    }, { passive: true });

    (async () => {
      try {
        const response = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        const info = await response.json();
        const current = localStorage.getItem('tokyoShiftBuild');

        if (current && current !== info.build) {
          localStorage.setItem('tokyoShiftBuild', info.build);

          // Development builds move quickly. Clear only Tokyo SHIFT caches and
          // retire the old worker so the installed iOS PWA cannot remain on
          // an older UI revision. Game/save localStorage is intentionally kept.
          try {
            const keys = await caches.keys();
            await Promise.all(
              keys
                .filter(key => key.startsWith('tokyoshift-'))
                .map(key => caches.delete(key))
            );
          } catch (e) {}

          try {
            const registrations = await navigator.serviceWorker?.getRegistrations?.();
            await Promise.all((registrations || []).map(reg => reg.unregister()));
          } catch (e) {}

          const url = new URL(location.href);
          url.searchParams.set('build', info.build);
          url.searchParams.set('_', Date.now().toString());
          location.replace(url.toString());
          return;
        }

        if (!current) localStorage.setItem('tokyoShiftBuild', info.build);
      } catch (e) {}

      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js?v=R137', { updateViaCache: 'none' });
          reg.update();
        } catch (e) {}
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js?v=20260923-r137"></script>
</body>
</html>
