<!doctype html><html><head><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#46586a;color:white;font:16px sans-serif}nav{padding:10px}button{padding:12px;margin:4px}canvas{max-width:100%}</style></head><body><nav id="nav"></nav><div id="game"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script type="module">
import {cars} from './src/data/cars.js';
import {preloadCarAppearanceAssets,preloadCarWheel,createCarBodyLayers} from './src/vehicles/CarAppearance.js';
import {getWheelPairFit} from './src/vehicles/WheelFit.js';
const seen=new Set(),roster=Object.values(cars).filter(c=>{const k=c.visual.bodyPath;if(seen.has(k))return false;seen.add(k);return true});
const page=+(new URLSearchParams(location.search).get('page')||0),flip=new URLSearchParams(location.search).has('flip');
for(let p=0;p<6;p++){let b=document.createElement('button');b.textContent='Page '+(p+1);b.onclick=()=>location.search='?page='+p+(flip?'&flip':'');document.querySelector('#nav').append(b)}
let b=document.createElement('button');b.textContent='Mirror';b.onclick=()=>location.search='?page='+page+(flip?'':'&flip');document.querySelector('#nav').append(b);
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:1400,height:1710,backgroundColor:'#687e91',scene:{preload(){for(const c of roster.slice(page*12,page*12+12)){preloadCarAppearanceAssets(this,{[c.id]:c});preloadCarWheel(this,c)}},create(){roster.slice(page*12,page*12+12).forEach((c,i)=>{const v=c.visual,s=.48,x=i%2*700+660,y=Math.floor(i/2)*285+250;this.add.text(i%2*700+12,Math.floor(i/2)*285+10,c.id+'  '+v.referenceRearWheelDiameter+'/'+v.referenceFrontWheelDiameter,{fontSize:16});this.add.line(0,0,i%2*700,y,i%2*700+690,y,0xffff00).setOrigin(0);const source=this.textures.get(v.wheelKey).getSourceImage(),fit=getWheelPairFit(v,s,flip,source);for(const axle of ['rear','front'])this.add.image(x+fit[axle].offsetX,y+fit[axle].offsetY,v.wheelKey).setScale(fit[axle].wheelScale).setDepth(10);createCarBodyLayers(this,c,{x,y,scale:s,depth:11,flipX:flip});});document.body.dataset.ready='true';}}});
</script></body></html>
